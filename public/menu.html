<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Dirección - Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #1e293b; color: #f1f5f9; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background-color: #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        form label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        form input, form select { display: block; width: 100%; padding: 0.75rem; border: 1px solid #475569; border-radius: 8px; margin-bottom: 1rem; background-color: #475569; color: #f1f5f9; font-size: 1rem; }
        form input[readonly] { background-color: #2c3748; cursor: not-allowed; }
        form button { width: 100%; padding: 0.75rem; border-radius: 8px; border: none; background-color: #FF85A2; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .phone-input-group { display: flex; align-items: center; gap: 0.5rem; }
        .phone-input-group select { flex: 0 0 120px; }
        .phone-input-group input { flex: 1 1 auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <form id="order-form">
                <h3>Tus Datos y Entrega (Modo de Prueba)</h3>
                
                <label for="telefonoCliente">Tu Teléfono (WhatsApp):</label>
                <div class="phone-input-group">
                    <select id="phonePrefix" required></select>
                    <input type="tel" id="telefonoCliente" required placeholder="10 dígitos" maxlength="10">
                </div>
                
                <label for="codigoPostal">Código Postal:</label>
                <input type="tel" id="codigoPostal" required pattern="\d{5}" title="Ingresa un código postal de 5 dígitos" maxlength="5">

                <label for="colonia">Colonia:</label>
                <select id="colonia" required>
                    <option value="">Primero ingresa tu código postal</option>
                </select>
                
                <label for="calleNumero">Calle y Número:</label>
                <input type="text" id="calleNumero" required>

                <label for="municipio">Municipio:</label>
                <input type="text" id="municipio" readonly required placeholder="Se llenará automáticamente">

                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" readonly required placeholder="Se llenará automáticamente">

                <label for="estado">Estado:</label>
                <input type="text" id="estado" readonly required placeholder="Se llenará automáticamente">

                <button type="submit">Realizar Pedido</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- Lógica para el prefijo telefónico (simplificada) ---
            const phonePrefixSelect = document.getElementById('phonePrefix');
            const option = document.createElement('option');
            option.value = "+52";
            option.textContent = "México (+52)";
            option.selected = true;
            phonePrefixSelect.appendChild(option);
            
            // ===== INICIO DE LA LÓGICA DE DIRECCIÓN 100% CORREGIDA =====
            const cpInput = document.getElementById('codigoPostal');
            const coloniaSelect = document.getElementById('colonia');
            const municipioInput = document.getElementById('municipio');
            const ciudadInput = document.getElementById('ciudad');
            const estadoInput = document.getElementById('estado');

            function setupAddressAutocomplete() {
                let debounceTimer;
                cpInput.addEventListener('input', () => {
                    cpInput.value = cpInput.value.replace(/[^\d]/g, '');
                    clearTimeout(debounceTimer);
                    if (cpInput.value.length === 5) {
                        debounceTimer = setTimeout(buscarCodigoPostal, 300);
                    } else {
                        resetAddressFields();
                    }
                });
            }

            async function buscarCodigoPostal() {
                const cp = cpInput.value;
                if (cp.length !== 5) return;
                
                coloniaSelect.innerHTML = '<option>Buscando...</option>';
                console.log(`Iniciando búsqueda para el CP: ${cp}`);

                try {
                    const response = await fetch(`https://api.copomex.com/query/info_cp/${cp}?token=pruebas`);
                    
                    if (!response.ok) {
                        throw new Error(`Error de red: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log("Respuesta recibida de la API:", data);

                    const resultData = Array.isArray(data) ? data[0] : data;
                    console.log("Datos normalizados para procesar:", resultData);

                    if (!resultData || resultData.error || !resultData.response) {
                        throw new Error(resultData.error_message || 'El formato de la respuesta no es válido');
                    }
                    
                    const { asentamiento, municipio, ciudad, estado } = resultData.response;
                    
                    console.log(`Municipio: ${municipio}, Ciudad: ${ciudad}, Estado: ${estado}`);

                    municipioInput.value = municipio || 'No disponible';
                    ciudadInput.value = ciudad || 'No disponible';
                    estadoInput.value = estado || 'No disponible';

                    coloniaSelect.innerHTML = '<option value="">-- Selecciona tu colonia --</option>';

                    if (Array.isArray(asentamiento)) {
                        console.log("Colonias encontradas:", asentamiento);
                        asentamiento.forEach(nombreColonia => {
                            const option = document.createElement('option');
                            option.value = nombreColonia;
                            option.textContent = nombreColonia;
                            coloniaSelect.appendChild(option);
                        });
                    } else {
                         console.log("No se encontraron colonias en la respuesta.");
                    }

                } catch (error) {
                    console.error("ERROR CRÍTICO en buscarCodigoPostal:", error);
                    resetAddressFields();
                    alert('No se pudo encontrar información para ese código postal. Por favor, verifícalo e intenta de nuevo.');
                }
            }

            function resetAddressFields() {
                coloniaSelect.innerHTML = '<option value="">Primero ingresa tu código postal</option>';
                municipioInput.value = '';
                ciudadInput.value = '';
                estadoInput.value = '';
            }
            // ===== FIN DE LA LÓGICA DE DIRECCIÓN =====
            
            // --- Inicialización ---
            setupAddressAutocomplete();
        });
    </script>
</body>
</html>
