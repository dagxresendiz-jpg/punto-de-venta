<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Dirección</title>
    <style>
        body { font-family: sans-serif; background-color: #2c3e50; color: #ecf0f1; padding: 2rem; }
        .card { max-width: 500px; margin: auto; background-color: #34495e; padding: 2rem; border-radius: 8px; }
        label { display: block; margin-bottom: 5px; color: #bdc3c7; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #7f8c8d; background-color: #ecf0f1; font-size: 1rem; box-sizing: border-box; }
        input[readonly] { background-color: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Prueba de Autocompletado de Dirección</h3>
        <label for="codigoPostal">Código Postal:</label>
        <input type="tel" id="codigoPostal" required maxlength="5">

        <label for="colonia">Colonia:</label>
        <select id="colonia" required>
            <option value="">Primero ingresa tu código postal</option>
        </select>
        
        <label for="municipio">Municipio:</label>
        <input type="text" id="municipio" readonly required placeholder="Se llenará automáticamente">

        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" readonly required placeholder="Se llenará automáticamente">

        <label for="estado">Estado:</label>
        <input type="text" id="estado" readonly required placeholder="Se llenará automáticamente">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cpInput = document.getElementById('codigoPostal');
            const coloniaSelect = document.getElementById('colonia');
            const municipioInput = document.getElementById('municipio');
            const ciudadInput = document.getElementById('ciudad');
            const estadoInput = document.getElementById('estado');

            function setupAddressAutocomplete() {
                let debounceTimer;
                cpInput.addEventListener('input', () => {
                    cpInput.value = cpInput.value.replace(/[^\d]/g, '');
                    clearTimeout(debounceTimer);
                    if (cpInput.value.length === 5) {
                        debounceTimer = setTimeout(buscarCodigoPostal, 300);
                    } else {
                        resetAddressFields();
                    }
                });
            }

            async function buscarCodigoPostal() {
                const cp = cpInput.value;
                if (cp.length !== 5) return;
                coloniaSelect.innerHTML = '<option>Buscando...</option>';
                try {
                    const response = await fetch(`https://api.datamx.io/gp/api/v1/cp/${cp}`);
                    if (!response.ok) throw new Error('El código postal no fue encontrado.');
                    const data = await response.json();
                    if (!data.results || data.results.length === 0) throw new Error('No se encontraron datos para este código postal.');
                    
                    const resultados = data.results;
                    const primerResultado = resultados[0];
                    
                    municipioInput.value = primerResultado.d_mnpio || 'N/A';
                    ciudadInput.value = primerResultado.d_ciudad || 'N/A';
                    estadoInput.value = primerResultado.d_estado || 'N/A';

                    coloniaSelect.innerHTML = '<option value="">-- Selecciona tu colonia --</option>';
                    const coloniasUnicas = [...new Set(resultados.map(entry => entry.d_asenta))];
                    coloniasUnicas.forEach(nombreColonia => {
                        const option = document.createElement('option');
                        option.value = nombreColonia;
                        option.textContent = nombreColonia;
                        coloniaSelect.appendChild(option);
                    });
                } catch (error) {
                    console.error("Error al buscar el código postal:", error);
                    resetAddressFields();
                    alert(error.message);
                }
            }

            function resetAddressFields() {
                coloniaSelect.innerHTML = '<option value="">Primero ingresa tu código postal</option>';
                municipioInput.value = '';
                ciudadInput.value = '';
                estadoInput.value = '';
            }
            
            setupAddressAutocomplete();
        });
    </script>
</body>
</html>
