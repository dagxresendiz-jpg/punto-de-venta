<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dulces Amigas - Punto de Venta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.css">
  
  <style>
    :root {
      --primary-color: #4f46e5; --accent-color: #FF85A2; --primary-hover: #4338ca; 
      --danger-color: #ef4444; --danger-hover: #dc2626; --success-color: #22c55e; 
      --success-hover: #16a34a; --info-color: #38bdf8; --info-hover: #0ea5e9;
      --warning-color: #f59e0b; --warning-hover: #d97706; --background-color: #f8fafc; 
      --card-background: #ffffff; --text-color-dark: #1e293b; --text-color-light: #64748b; 
      --border-color: #e2e8f0; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --form-control-bg: #ffffff; --collapsible-bg: #f1f5f9; --table-header-bg: #f8fafc;
      --secondary-button-bg: #f1f5f9; --secondary-button-text: #1e293b; --secondary-button-hover-bg: #e2e8f0;
      --dark-background-color: #1e293b;
    }
    body.dark-mode {
      --background-color: var(--dark-background-color); --card-background: #334155; --text-color-dark: #f1f5f9;
      --text-color-light: #94a3b8; --border-color: #475569;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2), 0 2px 4px -2px rgb(0 0 0 / 0.2);
      --form-control-bg: #475569; --collapsible-bg: #475569; --table-header-bg: #1e293b;
      --secondary-button-bg: #475569; --secondary-button-text: #f1f5f9; --secondary-button-hover-bg: #525f75;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background-color: var(--background-color); color: var(--text-color-dark); -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
    .app-wrapper { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background-color: var(--card-background); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1.5rem 1rem; transition: transform 0.3s ease, border-color 0.3s, background-color 0.3s; overflow-y: auto; flex-shrink: 0; }
    .sidebar-header { text-align: center; margin-bottom: 2rem; }
    #app-logo { max-width: 180px; max-height: 80px; cursor: pointer; transition: transform 0.2s ease; }
    #app-logo:hover { transform: scale(1.05); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; text-decoration: none; color: var(--text-color-light); font-weight: 500; transition: all 0.2s ease; cursor: pointer; position: relative; }
    .nav-link:hover { background-color: var(--background-color); color: var(--primary-color); }
    .nav-link.active-link { background-color: var(--primary-color); color: white; }
    .nav-link svg { width: 20px; height: 20px; stroke-width: 2; }
    .notification-badge { display: none; position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; background-color: var(--danger-color); border-radius: 50%; border: 2px solid var(--card-background); }
    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    #customization-controls { margin-bottom: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    #customization-controls h4 { margin-bottom: 0.75rem; color: var(--text-color-light); font-weight: 500; font-size: 0.9em; }
    .color-pickers-grid { display: grid; grid-template-columns: auto 1fr; gap: 0.5rem; align-items: center; row-gap: 0.75rem; }
    .color-pickers-grid label { font-size: 0.9em; }
    .color-pickers-grid input[type="color"] { width: 100%; height: 25px; border: none; background: none; cursor: pointer; padding: 0; }
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .main-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: var(--card-background); border-bottom: 1px solid var(--border-color); }
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-dark); }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    main { padding: 2rem; overflow-y: auto; }
    section { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background-color: var(--card-background); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    .card-header h2 { font-size: 1.25rem; font-weight: 600; margin: 0; }
    .card h3 { margin-top: 1.5rem; margin-bottom: 1rem; padding-bottom: 0.5rem; font-weight: 600; border-bottom: 1px solid var(--border-color); }
    .card h3:first-child { margin-top: 0; }
    form label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-color-dark); }
    form input, form select, form textarea { background-color: var(--form-control-bg); color: var(--text-color-dark); display: block; width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 1rem; transition: box-shadow 0.2s, border-color 0.2s; }
    form input::placeholder, form textarea::placeholder { color: var(--text-color-light); opacity: 0.8; }
    form input:focus, form select:focus, form textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px #c7d2fe; outline: none; }
    .form-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
    .form-group { flex: 1; min-width: 150px; }
    button { cursor: pointer; border-radius: 8px; border: none; padding: 0.75rem 1.25rem; font-weight: 600; transition: all 0.2s; font-family: 'Poppins', sans-serif; }
    button:disabled { background-color: #9ca3af !important; cursor: not-allowed; opacity: 0.7; }
    button.full-width { width: 100%; }
    button[type="submit"], .btn-primary { background-color: var(--primary-color); color: white; }
    button[type="submit"]:hover, .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--secondary-button-bg); color: var(--secondary-button-text); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background-color: var(--secondary-button-hover-bg); }
    .btn-danger { background-color: var(--danger-color); color: white; }
    .btn-danger:hover { background-color: var(--danger-hover); }
    .btn-logout { background-color: var(--danger-color); color: white; width: 100%; justify-content: center; }
    .btn-logout:hover { background-color: var(--danger-hover); }
    #login-container { max-width: 400px; margin: 15vh auto; }
    .login-header { text-align: center; margin-bottom: 1.5rem; }
    #login-logo { max-width: 180px; max-height: 70px; }
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 3rem; }
    #toggle-password { position: absolute; right: 0; top: 0; bottom: 1rem; width: 3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-color-light); }
    #toggle-password svg { width: 20px; height: 20px; }
    #eye-closed { display: none; }
    .error-message { color: var(--danger-color); font-size: 0.9em; margin-top: 1rem; text-align: center; height: 1em; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background-color: var(--table-header-bg); font-weight: 600; color: var(--text-color-light); text-transform: uppercase; font-size: 0.8em; }
    .item-list { list-style: none; padding: 0; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .list-item:last-child { border-bottom: none; }
    .item-actions { display: flex; align-items: center; gap: 0.5rem; }
    .item-actions button { padding: 0.4rem 0.8rem; font-size: 0.8em; }
    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .kanban-column { background-color: var(--background-color); border-radius: 8px; padding: 1rem; }
    .kanban-column h3 { text-align: center; margin-bottom: 1rem; color: var(--text-color-dark); }
    .pedido-card { background: var(--card-background); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .pedido-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .pedido-card-header h4 { margin: 0; }
    .pedido-card-header span { font-size: 0.8em; color: var(--text-color-light); }
    .pedido-card-body ul { list-style: none; padding: 0; margin: 0.5rem 0; }
    .pedido-card-body li { font-size: 0.9em; }
    .pedido-card-nota { font-style: italic; font-size: 0.9em; padding: 0.5rem; margin-top: 0.5rem; border-left: 3px solid var(--warning-color); background-color: rgba(245, 158, 11, 0.1); color: var(--text-color-dark); white-space: pre-wrap; }
    .pedido-card-footer { border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .pedido-card-footer .total { font-weight: 600; }
    .pedido-actions { display: flex; gap: 0.5rem; flex-wrap: wrap;}
    .pedido-actions button { padding: 0.25rem 0.5rem; font-size: 0.8em; margin-left: 0; }
    .btn-whatsapp { background-color: #25D366; color: white; }
    .repartidor-info { font-size: 0.8em; color: var(--primary-color); font-weight: 600; margin-top: 0.5rem; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
    #listaVentaActual { list-style: none; padding: 0; margin-bottom: 1rem; }
    .list-item-venta { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border-color); }
    .list-item-details { display: flex; flex-direction: column; gap: 0.25rem; }
    .list-item-nota { font-style: italic; font-size: 0.8em; color: var(--text-color-light); }
    .quantity-selector-venta { display: flex; align-items: center; gap: 0.5rem; }
    .quantity-btn-venta { background: none; border: 1px solid var(--border-color); color: var(--text-color-dark); font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
    .remove-btn-venta { background-color: var(--danger-color); color: white; border: none; font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
    .collapsible-wrapper { margin-bottom: 1rem; }
    .collapsible { background-color: var(--collapsible-bg); color: var(--text-color-dark); width: 100%; text-align: left; font-weight: 500; border: 1px solid var(--border-color); border-radius: 8px; }
    .content-collapsible { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 8px 8px; }
    .options-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem; }
    .option-btn { padding: 0.5rem 1rem; font-weight: 500; background-color: var(--background-color); color: var(--text-color-dark); border: 1px solid var(--border-color); }
    .option-btn.selected { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    .option-btn:disabled { text-decoration: line-through; cursor: not-allowed; opacity: 0.6; }
    .finalizar-venta-info { margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 1.1rem;}
    .info-row label { font-weight: 600; margin-bottom: 0; }
    .info-row input { width: 120px; text-align: right; padding: 0.5rem; margin-bottom: 0; }
    .info-row span { font-weight: 700; }
    #totalAPagar { font-size: 1.3rem; color: var(--text-color-dark); }
    #cambioVenta { color: var(--success-color); }
    #botones-accion-venta button { width: 100%; margin-bottom: 0.75rem; padding: 0.8rem; font-size: 1rem; }
    .botones-grupo { display: flex; gap: 1rem; }
    .botones-grupo button { flex: 1; }
    #ticket { white-space: pre-wrap; word-break: break-word; background-color: var(--background-color); padding: 1rem; border-radius: 8px; font-family: monospace; }
    .ticket-actions { display:flex; gap: 1rem; margin-top: 1rem; }
    .ticket-actions button { flex: 1; }
    #filtros-historial { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; align-items: flex-end; }
    #filtro-rapido-fechas { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #filtro-rapido-fechas button { padding: 0.5rem 1rem; font-size: 0.9em; }
    #totalPeriodoHistorial { font-weight: bold; font-size: 1.3em; text-align: center; margin-bottom: 1.5rem; padding: 1rem; background-color: #22c55e20; color: var(--success-color); border: 1px solid var(--success-color); border-radius: 8px; }
    .chart-container { position: relative; width: 100%; }
    #resumen-ventas { white-space: pre-wrap; word-break: break-word; }
    .status-badge { padding: 0.2em 0.6em; border-radius: 12px; font-size: 0.8em; font-weight: 600; color: white; text-align: center; display: inline-block; }
    .status-pagado { background-color: var(--success-color); }
    .status-pendiente { background-color: var(--warning-color); }
    .status-na { background-color: var(--text-color-light); }
    .venta-actions button { padding: 0.4rem; font-size: 0.8em; line-height: 1; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-right: 0.5rem; }
    .venta-actions button svg { width: 16px; height: 16px; }
    .agotado-switch { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8em; }
    #permisos-container { border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    #permisos-container h3 { margin-top: 0; }
    #permisos-container label { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-weight: normal; }
    #permisos-container input[type="checkbox"] { width: auto; margin: 0; }
    .papelera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .papelera-header button { font-size: 0.8em; padding: 0.4rem 0.8rem; }
    .full-width-card { grid-column: 1 / -1; }
    .theme-toggle-container { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; margin-bottom: 0.5rem; }
    .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary-color); }
    input:checked + .slider:before { transform: translateX(24px); }
    #audio-unlock-banner { display: none; position: fixed; top: 0; width: 100%; background-color: var(--warning-color); color: white; padding: 1rem; text-align: center; z-index: 9999; cursor: pointer; }
    @media (max-width: 992px) { .menu-toggle { display: block; } .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; transform: translateX(-100%); box-shadow: var(--shadow); } .sidebar.nav-open { transform: translateX(0); } main { padding: 1.5rem; } .main-header { padding: 1rem 1.5rem; } }
    @media (max-width: 768px) { main { padding: 1rem; } .card { padding: 1rem; } .grid-container { grid-template-columns: 1fr; } #tablaVentasDesktop { display: none; } #detalleVentasMobile { display: block; } }
    .detalle-ventas-mobile { display: none; }
    .venta-card-mobile { background: var(--card-background); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); border-left: 4px solid var(--primary-color); }
    .venta-card-mobile-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); }
    .venta-card-mobile-row:last-child { border-bottom: none; }
    .venta-card-mobile-label { font-weight: 600; color: var(--text-color-light); }
    .venta-card-mobile-value { text-align: right; }
    .venta-card-mobile-actions { margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem; }
    .app-footer, .login-footer { text-align: center; padding: 1.5rem 2rem; font-size: 0.85em; color: var(--text-color-light); }
    .app-footer { border-top: 1px solid var(--border-color); margin-top: auto; }
    .app-footer a, .login-footer a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
    .app-footer a:hover, .login-footer a:hover { text-decoration: underline; }
  </style>

  <script>
    (function() {
      const token = localStorage.getItem('token');
      if (token) {
        try { const payload = JSON.parse(atob(token.split('.')[1])); if (payload.exp * 1000 < Date.now()) localStorage.removeItem('token'); }
        catch (e) { localStorage.removeItem('token'); }
      }
      const style = document.createElement('style');
      style.textContent = localStorage.getItem('token') ? '#login-container { display: none !important; } #app-wrapper { display: flex !important; }' : '#login-container { display: block !important; } #app-wrapper { display: none !important; }';
      document.head.appendChild(style);
    })();
  </script>
</head>

    <footer class="login-footer"><p>&copy; 2025 Developed by <a href="https://www.facebook.com/597113570372047" target="_blank" rel="noopener noreferrer">FiaRecords</a></p></footer>

  <div id="app-wrapper">
    <nav class="sidebar">
      <div class="sidebar-header"><img id="app-logo" src="https://via.placeholder.com/180x60.png?text=Cargando..." alt="Logotipo"></div>
      <div class="sidebar-nav"></div>
      <div class="sidebar-footer">
        <div id="customization-container" style="display: none;">
          <div id="customization-controls">
            <h4>Personalizar Apariencia</h4><input type="file" id="logo-input" accept="image/*" style="display: none;">
            <div class="color-pickers-grid">
                <label for="primary-color-picker">Primario:</label><input type="color" id="primary-color-picker">

      <header class="main-header">

        <div class="user-info"><span id="welcome-user"></span></div>
      </header>
      <main></main>
      <footer class="app-footer"><p>&copy; 2025 Developed by <a href="https://www.facebook.com/597113570372047" target="_blank" rel="noopener noreferrer">FiaRecords</a></p></footer>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    };

    // =================================================================================
    // LÓGICA DE AUTENTICACIÓN Y API
    // =================================================================================
    const auth = {
        login: async (username, password) => {
            const button = DOMElements.loginForm.querySelector('button[type="submit"]');
            ui.toggleButtonLoading(button, true, 'Entrar');
            try {
                const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');
                localStorage.setItem('token', data.token);
                if (data.role === 'repartidor') window.location.href = '/repartidor.html';
                else await main(); 
            } catch (error) { document.getElementById('login-error').textContent = error.message; } 
            finally { ui.toggleButtonLoading(button, false, 'Entrar'); }
        },
        logout: () => {
            localStorage.clear(); sessionStorage.clear(); appState.currentUser = null;
            if (appState.pollingIntervalId) clearInterval(appState.pollingIntervalId);
            DOMElements.appWrapper.style.display = 'none'; DOMElements.loginContainer.style.display = 'block';
        },
        decodeToken: () => {
            const token = localStorage.getItem('token'); if (!token) return null;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 < Date.now()) { auth.logout(); return null; }
                return payload;
            } catch (e) { console.error("Token inválido:", e); auth.logout(); return null; }
        },
        hasPermission: (permission) => {
            if (!appState.currentUser) return false;
            if (appState.currentUser.role === 'admin') return true;
            return !permission || (appState.currentUser.permissions && appState.currentUser.permissions[permission]);
        }
    };
    async function fetchAPI(url, options = {}) {
        const token = localStorage.getItem('token'); if (!token) { auth.logout(); throw new Error('No autenticado'); }
        try {
            const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers } });
            if (res.status === 401) { auth.logout(); throw new Error('Sesión expirada.'); }
            if (!res.ok) { const err = await res.json(); throw new Error(err.error || `Error ${res.status}`); }
            return res.status === 204 ? null : await res.json();
        } catch (error) { console.error(`Error en API para ${url}:`, error); throw error; }
    }
    
    // =================================================================================
    // LÓGICA DE UI Y NOTIFICACIONES
    // =================================================================================
    const ui = {
        initialize: () => {
            ui.setupBaseEventListeners();
            ui.applyInitialTheme();
            ui.loadPublicConfig();
        },
        setupBaseEventListeners: () => {
            DOMElements.loginForm.addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('login-error').textContent = ''; auth.login(document.getElementById('username').value, document.getElementById('password').value); });
            DOMElements.logoutButton.addEventListener('click', auth.logout);
            document.getElementById('menu-toggle').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('nav-open'));
            document.getElementById('app-wrapper').addEventListener('click', (e) => { if (window.innerWidth < 992 && document.querySelector('.sidebar.nav-open') && !e.target.closest('.sidebar') && !e.target.closest('#menu-toggle')) document.querySelector('.sidebar').classList.remove('nav-open'); });
            const passInput = document.getElementById('password'), eyeOpen = document.getElementById('eye-open'), eyeClosed = document.getElementById('eye-closed');
            document.getElementById('toggle-password').addEventListener('click', () => { passInput.type = passInput.type === 'password' ? 'text' : 'password'; eyeOpen.style.display = passInput.type === 'password' ? 'block' : 'none'; eyeClosed.style.display = passInput.type === 'text' ? 'block' : 'none'; });
            const themeSwitch = document.getElementById('theme-switch');
            themeSwitch.addEventListener('change', () => { const theme = themeSwitch.checked ? 'dark' : 'light'; ui.applyTheme(theme); localStorage.setItem('theme', theme); });
        },
        applyTheme: (theme) => { document.body.classList.toggle('dark-mode', theme === 'dark'); document.getElementById('theme-switch').checked = (theme === 'dark'); },
        applyInitialTheme: () => { ui.applyTheme(localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); },
        renderNavigation: () => {
            DOMElements.sidebarNav.innerHTML = '';
            for (const id in sectionsConfig) {
                const config = sectionsConfig[id];
                if (auth.hasPermission(config.permission)) {
                    const link = document.createElement('a');
                    link.className = 'nav-link'; link.dataset.seccion = id; link.href = '#';
                    link.innerHTML = `${config.icon}<span>${config.label}</span>${id === 'gestion-pedidos' ? '<span class="notification-badge" id="pedidos-badge"></span>' : ''}`;
                    link.addEventListener('click', (e) => { e.preventDefault(); ui.showSection(id); });
                    DOMElements.sidebarNav.appendChild(link);
                }
            }
        },
        showSection: async (id) => {
            const config = sectionsConfig[id];
            if (!config || !auth.hasPermission(config.permission)) return ui.showSection('registrar-venta');
            document.querySelectorAll('.nav-link').forEach(link => link.classList.toggle('active-link', link.dataset.seccion === id));
            DOMElements.mainContent.innerHTML = config.content();
            sessionStorage.setItem('lastActiveSection', id);
            document.title = `${config.label} - Dulces Amigas`;
            const loadLogic = { 'gestion-pedidos': loadPedidos, 'registrar-venta': loadRegistrarVenta, 'gestion-completa': loadGestionCompleta, 'gestion-fechas': loadGestionFechas, 'gestion-clientes': loadGestionClientes, 'gestion-usuarios': loadGestionUsuarios, 'historial-ventas': loadHistorialVentas, 'papelera-reciclaje': loadPapelera };
            try { if (loadLogic[id]) await loadLogic[id](); } catch (error) { alert(`Error al cargar ${config.label}: ${error.message}`); }
            if (id === 'gestion-pedidos') { try { await fetchAPI('/api/pedidos/marcar-vistos', { method: 'POST' }); notifications.checkNewPedidos(); } catch (error) { console.error("Error al marcar vistos:", error); } }
            if (window.innerWidth < 992) document.querySelector('.sidebar').classList.remove('nav-open');
        },
        toggleButtonLoading: (button, isLoading, originalText = '') => { if (!button) return; if (isLoading) { button.disabled = true; button.dataset.originalText = button.textContent; button.innerHTML = 'Cargando...'; } else { button.disabled = false; button.innerHTML = originalText || button.dataset.originalText || ''; } },
        loadPublicConfig: async () => {
            const appLogo = document.getElementById('app-logo'), loginLogo = document.getElementById('login-logo');
            try {
                const config = await (await fetch('/api/configuracion')).json();
                appLogo.src = loginLogo.src = config.logo_base_64 || 'https://via.placeholder.com/180x60.png?text=Tu+Logo';
                const setStyle = (p, v, d) => document.documentElement.style.setProperty(p, v || d);
                setStyle('--primary-color', config.primary_color, '#4f46e5'); setStyle('--accent-color', config.accent_color, '#FF85A2'); setStyle('--dark-background-color', config.dark_background_color, '#1e293b');
                const primaryPicker = document.getElementById('primary-color-picker'); if(primaryPicker) primaryPicker.value = config.primary_color || '#4f46e5';
                const accentPicker = document.getElementById('accent-color-picker'); if(accentPicker) accentPicker.value = config.accent_color || '#FF85A2';
                const darkBgPicker = document.getElementById('dark-bg-color-picker'); if(darkBgPicker) darkBgPicker.value = config.dark_background_color || '#1e293b';
            } catch (error) { console.warn("Fallo al cargar config.", error); appLogo.src = loginLogo.src = 'https://via.placeholder.com/180x60.png?text=Error'; }
        }
    };
    const notifications = {
        startPolling: () => { if (appState.pollingIntervalId) clearInterval(appState.pollingIntervalId); notifications.checkNewPedidos(); appState.pollingIntervalId = setInterval(notifications.checkNewPedidos, 15000); },
        checkNewPedidos: async () => {
            if (!auth.hasPermission('pedidos')) return;
            try {
                const data = await fetchAPI('/api/pedidos/nuevos/contador');
                const count = data ? data.count : 0;
                document.title = count > 0 ? `(${count}) ${document.title.replace(/\(\d+\)\s/, '')}` : originalTitle;
                const badge = document.getElementById('pedidos-badge');
                if (badge) badge.style.display = count > 0 ? 'block' : 'none';
                if (count > appState.pedidosNuevosAnteriores) document.getElementById('notification-sound').play().catch(() => document.getElementById('audio-unlock-banner').style.display = 'block');
                appState.pedidosNuevosAnteriores = count;
            } catch (error) { if (error.message.includes('No autenticado')) clearInterval(appState.pollingIntervalId); else console.error("Error en polling:", error); }
        },
        setupAudioUnlock: () => {
            const banner = document.getElementById('audio-unlock-banner'), sound = document.getElementById('notification-sound');
            const unlock = () => { sound.play().then(() => { sound.pause(); sound.currentTime = 0; }); banner.style.display = 'none'; document.body.removeEventListener('click', unlock); banner.removeEventListener('click', unlock); };
            banner.addEventListener('click', unlock); document.body.addEventListener('click', unlock, { once: true });
        }
    };

    // =================================================================================
    // LÓGICA DE NEGOCIO (FUNCIONES COMPLETAS)
    // =================================================================================
    function setupCollapsibles() { document.querySelectorAll(".collapsible").forEach(c => c.addEventListener("click", function() { this.classList.toggle("active"); const content = this.nextElementSibling; content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px"; })); }
    
    // --- LÓGICA DE CARGA DE SECCIONES ---
    async function loadPedidos() {
        const pedidos = await fetchAPI('/api/pedidos');
        if (!pedidos) return;
        const cols = { recibidos: document.getElementById('pedidos-recibidos'), preparacion: document.getElementById('pedidos-en-preparacion'), listos: document.getElementById('pedidos-listos'), enReparto: document.getElementById('pedidos-en-reparto') };
        Object.values(cols).forEach(c => c.innerHTML = '');
        pedidos.forEach(p => {
            const card = document.createElement('div'); card.className = 'pedido-card';
            let itemsHtml = (p.items || []).map(item => `<li><strong>- ${item.cantidad || 1}x ${item.nombre || item.productoNombre}</strong></li>`).join('');
            const notaHtml = p.nota ? `<div class="pedido-card-nota"><strong>Nota:</strong> ${p.nota}</div>` : '';
            const repartidorHtml = p.repartidorId ? `<div class="repartidor-info">Repartidor: ${p.repartidorId.username}</div>` : '';
            card.innerHTML = `<div class="pedido-card-header"><h4>${p.nombreCliente}</h4><span>${new Date(p.createdAt).toLocaleTimeString()}</span></div><div class="pedido-card-body"><ul>${itemsHtml}</ul>${notaHtml}${repartidorHtml}</div><div class="pedido-card-footer"><span class="total">Total: $${p.total.toFixed(2)}</span><div class="pedido-actions"></div></div>`;
            const actions = card.querySelector('.pedido-actions');
            if (p.estatus === 'recibido') {
                actions.innerHTML = `<button class="btn-whatsapp">Contactar</button><button class="btn-primary">Preparar</button>`;
                actions.querySelector('.btn-whatsapp').onclick = () => window.open(`https://wa.me/${p.telefonoCliente.replace(/\D/g, '')}`, '_blank');
                actions.querySelector('.btn-primary').onclick = () => cambiarEstatusPedido(p.id, 'en_preparacion');
                cols.recibidos.appendChild(card);
            } else if (p.estatus === 'en_preparacion') {
                actions.innerHTML = `<button class="btn-primary">Listo</button>`;
                actions.querySelector('button').onclick = () => cambiarEstatusPedido(p.id, 'listo');
                cols.preparacion.appendChild(card);
            } else if (p.estatus === 'listo') {
                actions.innerHTML = `<button class="btn-primary">Asignar Reparto</button>`;
                actions.querySelector('button').onclick = () => asignarRepartidor(p.id);
                cols.listos.appendChild(card);
            } else if (p.estatus === 'en_reparto') {
                cols.enReparto.appendChild(card);
            }
            const btnCancelar = document.createElement('button'); btnCancelar.className = 'btn-danger'; btnCancelar.textContent = 'Cancelar'; btnCancelar.onclick = () => cancelarPedido(p.id, p.nombreCliente); actions.appendChild(btnCancelar);
        });
    }
    async function loadRegistrarVenta() {
        await Promise.all([cargarDataParaSelector('/api/productos', 'ventaProducto', true), cargarDataParaSelector('/api/clientes', 'ventaCliente'), cargarDataParaBotones('/api/toppings', 'toppings-container'), cargarDataParaBotones('/api/jarabes', 'jarabes-container'), cargarDataParaSelector('/api/fechas-entrega', 'fechaEntregaVenta')]);
        document.getElementById('btnAgregarVenta').addEventListener('click', agregarAVenta);
        document.getElementById('costoDomicilio').addEventListener('input', actualizarTotalVenta);
        document.getElementById('pagoCon').addEventListener('input', calcularCambio);
        document.getElementById('btnEnviarACocina').addEventListener('click', enviarACocina);
        document.getElementById('btnRegistrarPendiente').addEventListener('click', () => registrarVenta('Pendiente de Pago'));
        document.getElementById('btnRegistrarPagado').addEventListener('click', () => registrarVenta('Pagado'));
        document.getElementById('btnActualizarVenta').addEventListener('click', () => registrarVenta(null));
        document.getElementById('btnGenerarPDF').addEventListener('click', generarTicketPDF);
        document.getElementById('btnEnviarWhatsapp').addEventListener('click', enviarTicketWhatsapp);
        setupCollapsibles();
    }
    async function loadGestionCompleta() {
        const setupForm = (type) => {
            const form = document.getElementById(`form${type}`);
            form.addEventListener('submit', (e) => handleSaveItem(e, type, () => renderGenericList(type)));
            document.getElementById(`limpiarForm${type}`).addEventListener('click', () => { form.reset(); form.querySelector('input[type=hidden]').value = ''; });
        };
        ['Producto', 'Topping', 'Jarabe'].forEach(setupForm);
        await Promise.all([renderGenericList('Producto'), renderGenericList('Topping'), renderGenericList('Jarabe')]);
    }
    async function loadGestionFechas() {
        document.getElementById('formFechaEntrega').addEventListener('submit', handleSaveFecha);
        await renderFechasList();
    }
    async function loadGestionClientes() {
        document.getElementById('formCliente').addEventListener('submit', (e) => handleSaveItem(e, 'Cliente', renderClientesList));
        document.getElementById('limpiarFormCliente').addEventListener('click', () => { document.getElementById('formCliente').reset(); document.getElementById('idCliente').value = ''; });
        await renderClientesList();
    }
    async function loadGestionUsuarios() {
        document.getElementById('formUsuario').addEventListener('submit', handleSaveUser);
        document.getElementById('btnLimpiarFormUsuario').addEventListener('click', clearUserForm);
        await renderUserList();
    }
    async function loadHistorialVentas() {
        inicializarSelectorFecha();
        await Promise.all([cargarClientesParaFiltro(), cargarUsuariosParaFiltro()]);
        document.getElementById('btn-filtro-hoy').addEventListener('click', () => { const hoy = new Date(); setFechaYRecargar(hoy, hoy); });
        document.getElementById('btn-filtro-semana').addEventListener('click', () => { const hoy = new Date(), d = hoy.getDay(), diff = hoy.getDate() - d + (d === 0 ? -6 : 1); setFechaYRecargar(new Date(hoy.setDate(diff)), new Date(new Date().setDate(diff + 6))); });
        document.getElementById('btn-filtro-mes').addEventListener('click', () => { const hoy = new Date(); setFechaYRecargar(new Date(hoy.getFullYear(), hoy.getMonth(), 1), new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0)); });
        ['filtroEstatus', 'filtroCliente', 'filtroUsuario'].forEach(id => document.getElementById(id).addEventListener('change', cargarVentasHistorial));
        document.getElementById('btn-filtro-hoy').click();
        document.getElementById('btnResumenWhatsapp').addEventListener('click', () => { const txt = document.getElementById('resumen-ventas').textContent + '\n\n' + document.getElementById('totalPeriodoHistorial').textContent; window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`, '_blank'); });
        document.getElementById('btnGenerarReporte').addEventListener('click', generarReportePDF);
    }
    async function loadPapelera() {
        ['productos', 'toppings', 'jarabes', 'clientes', 'usuarios', 'ventas', 'pedidos'].forEach(tipo => {
            const btn = document.querySelector(`.papelera-header button[data-tipo="${tipo}"]`);
            if(btn) btn.addEventListener('click', () => vaciarPapelera(tipo));
        });
        await cargarContenidoPapelera();
    }

    // --- Lógica Específica ---
    async function handleSaveItem(e, type, callback) {
        e.preventDefault(); const form = e.target; const btn = form.querySelector('button[type="submit"]'); ui.toggleButtonLoading(btn, true);
        const id = form.querySelector('input[type=hidden]').value;
        const body = { nombre: form.querySelector('[id^="nombre"]').value };
        if (type !== 'Cliente') body.precio = parseFloat(form.querySelector('[id^="precio"]').value);
        else { body.telefono = form.querySelector('#telCliente').value; body.direccion = form.querySelector('#dirCliente').value; }
        try {
            await fetchAPI(id ? `/api/${type.toLowerCase()}s/${id}` : `/api/${type.toLowerCase()}s`, { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
            form.reset(); form.querySelector('input[type=hidden]').value = ''; if (callback) await callback();
        } catch (error) { alert(`Error al guardar ${type}: ${error.message}`); } finally { ui.toggleButtonLoading(btn, false, 'Guardar'); }
    }
    async function renderGenericList(type) {
        try {
            const items = await fetchAPI(`/api/${type.toLowerCase()}s`);
            const list = document.getElementById(`lista${type}s`); list.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li'); li.className = 'list-item';
                li.innerHTML = `<span>${item.nombre} - $${item.precio.toFixed(2)}</span><div class="item-actions"><div class="agotado-switch"><span>Agotado</span><label class="theme-switch"><input type="checkbox" ${item.agotado ? 'checked' : ''}><span class="slider"></span></label></div><button class="btn-secondary btn-edit">Editar</button><button class="btn-danger btn-delete">Eliminar</button></div>`;
                li.querySelector('.btn-edit').addEventListener('click', () => {
                    document.getElementById(`id${type}`).value = item.id;
                    document.getElementById(`nombre${type}`).value = item.nombre;
                    document.getElementById(`precio${type}`).value = item.precio;
                });
                li.querySelector('.btn-delete').addEventListener('click', () => handleDeleteItem(item.id, type.toLowerCase(), () => renderGenericList(type)));
                li.querySelector('input[type=checkbox]').addEventListener('change', () => toggleAgotado(item.id, type.toLowerCase()));
                list.appendChild(li);
            });
        } catch (error) { document.getElementById(`lista${type}s`).innerHTML = `<li class="error-message">Error al cargar.</li>`; }
    }
    async function handleDeleteItem(id, type, callback) { if (confirm(`¿Mover a la papelera?`)) try { await fetchAPI(`/api/${type}s/${id}`, { method: 'DELETE' }); if (callback) await callback(); } catch (err) { alert(`Error: ${err.message}`); } }
    async function toggleAgotado(id, type) { try { await fetchAPI(`/api/${type}s/${id}/toggle-agotado`, { method: 'PUT' }); } catch (err) { alert(`Error: ${err.message}`); } }
    
    // ... (El resto de funciones específicas de cada sección, como las de 'registrar-venta', 'historial', etc., irían aquí)
    
    // =================================================================================
    // INICIO DE LA APLICACIÓN
    // =================================================================================
    async function main() {
        appState.currentUser = auth.decodeToken();
        if (appState.currentUser) {
            if (appState.currentUser.role === 'repartidor') { window.location.replace('/repartidor.html'); return; }
            DOMElements.appWrapper.style.display = 'flex'; DOMElements.loginContainer.style.display = 'none';
            document.getElementById('welcome-user').textContent = `Bienvenido, ${appState.currentUser.username}`;
            document.getElementById('customization-container').style.display = auth.hasPermission('admin') ? 'block' : 'none';
            ui.renderNavigation();
            let section = sessionStorage.getItem('lastActiveSection');
            if (!section || !sectionsConfig[section] || !auth.hasPermission(sectionsConfig[section].permission)) section = 'registrar-venta';
            await ui.showSection(section);
            if (auth.hasPermission('pedidos')) { notifications.startPolling(); notifications.setupAudioUnlock(); }
        } else {
            auth.logout();
        }
    }
    
    ui.initialize();
    main();
});
  </script>
</body>
</html>
