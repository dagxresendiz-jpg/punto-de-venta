<!DOCTYPE html>
<html lang="es">
<head>

  <title>Dulces Amigas - Punto de Venta</title>

  <style>
    body { visibility: hidden; }
    :root {
      --primary-color: #4f46e5; --accent-color: #FF85A2; --primary-hover: #4338ca; 
      --danger-color: #ef4444; --danger-hover: #dc2626; --success-color: #22c55e; 
      --success-hover: #16a34a; --info-color: #38bdf8; --info-hover: #0ea5e9;
      --warning-color: #f59e0b; --warning-hover: #d97706;
      --background-color: #f8fafc; --card-background: #ffffff; --text-color-dark: #1e293b; 
      --text-color-light: #64748b; --border-color: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --form-control-bg: #ffffff; --collapsible-bg: #f1f5f9; --table-header-bg: #f8fafc;
      --secondary-button-bg: #f1f5f9; --secondary-button-text: #1e293b; --secondary-button-hover-bg: #e2e8f0;
      --dark-background-color: #1e293b;
    }
    body.dark-mode {
      --background-color: var(--dark-background-color); --card-background: #334155; --text-color-dark: #f1f5f9;
      --text-color-light: #94a3b8; --border-color: #475569;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2), 0 2px 4px -2px rgb(0 0 0 / 0.2);
      --form-control-bg: #475569; --collapsible-bg: #475569; --table-header-bg: #1e293b;
      --secondary-button-bg: #475569; --secondary-button-text: #f1f5f9; --secondary-button-hover-bg: #525f75;
    }
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
    .product-item > div { display: flex; align-items: center; gap: 1rem; }
    .agotado-switch { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8em; }
    .agotado-switch .slider { width: 40px; height: 20px; }
    .agotado-switch .slider:before { height: 14px; width: 14px; bottom: 3px; }
    input:checked + .slider:before { transform: translateX(18px); }
    .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .kanban-column { background-color: var(--background-color); border-radius: 8px; padding: 1rem; }
    .kanban-column h3 { text-align: center; margin-bottom: 1rem; color: var(--text-color-dark); }
    .pedido-card { background: var(--card-background); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .pedido-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .pedido-card-header h4 { margin: 0; }
    .pedido-card-header span { font-size: 0.8em; color: var(--text-color-light); }
    .pedido-card-body ul { list-style: none; padding: 0; margin: 0.5rem 0; }
    .pedido-card-body li { font-size: 0.9em; }
    .pedido-card-nota {
        font-style: italic;
        font-size: 0.9em;
        padding: 0.5rem;
        margin-top: 0.5rem;
        border-left: 3px solid var(--warning-color);
        background-color: rgba(245, 158, 11, 0.1);
        color: var(--text-color-dark);
        white-space: pre-wrap;
    }
    .pedido-card-footer { border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .pedido-card-footer .total { font-weight: 600; }
    .pedido-actions { display: flex; gap: 0.5rem; flex-wrap: wrap;}
    .pedido-actions button { padding: 0.25rem 0.5rem; font-size: 0.8em; margin-left: 0; }
    .btn-whatsapp { background-color: #25D366; color: white; }
    .btn-preparar { background-color: var(--info-color); color: white; }
    .btn-listo { background-color: var(--success-color); color: white; }
    .btn-asignar { background-color: var(--primary-color); color: white; }
    .btn-cancelar { background-color: var(--danger-color); color: white; }
    .repartidor-info { font-size: 0.8em; color: var(--primary-color); font-weight: 600; margin-top: 0.5rem; }
    .nav-link { position: relative; }
    .notification-badge {
        display: none;
        position: absolute;
        top: 10px;
        right: 10px;
        width: 10px;
        height: 10px;
        background-color: var(--danger-color);
        border-radius: 50%;
        border: 2px solid var(--card-background);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background-color: var(--background-color); color: var(--text-color-dark); -webkit-font-smoothing: antialiased; }
    .app-wrapper { display: flex; min-height: 100vh; }
    .sidebar { 
        width: 250px; 
        background-color: var(--card-background); 
        border-right: 1px solid var(--border-color); 
        display: flex; 
        flex-direction: column; 
        padding: 1.5rem 1rem; 
        transition: transform 0.3s ease; 
        overflow-y: auto;
    }
    .sidebar-header { text-align: center; margin-bottom: 2rem; }
    #app-logo { max-width: 180px; max-height: 80px; cursor: pointer; transition: transform 0.2s ease; }
    #app-logo:hover { transform: scale(1.05); }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; text-decoration: none; color: var(--text-color-light); font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
    .nav-link:hover { background-color: var(--background-color); color: var(--primary-color); }
    .nav-link.active-link { background-color: var(--primary-color); color: white; }
    .nav-link svg { width: 20px; height: 20px; stroke-width: 2; }
    .sidebar-footer { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    #logout-button { width: 100%; justify-content: center; background-color: var(--danger-color); color: white; border: none; font-weight: 500; }
    #logout-button:hover { background-color: var(--danger-hover); }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .main-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: var(--card-background); border-bottom: 1px solid var(--border-color); }
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-dark); }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    main { padding: 2rem; overflow-y: auto; }
    section { display: none; }
    section.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { background-color: var(--card-background); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .card-header h2, .card-header h3 { font-size: 1.25rem; font-weight: 600; border: none; padding: 0; margin: 0; }
    .card h3 { margin-top: 1.5rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; font-weight: 600; }
    .card h3:first-child { margin-top: 0; }
    .export-buttons button { padding: 0.4rem; font-size: 0.8em; line-height: 1; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
    .export-buttons button svg { width: 18px; height: 18px; }
    form label { display: block; margin-bottom: 0.5rem; font-weight: 500; text-align: left; color: var(--text-color-dark); }
    form input, form select, form textarea { background-color: var(--form-control-bg); color: var(--text-color-dark); display: block; width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 1rem; transition: box-shadow 0.2s, border-color 0.2s; }
    form input::placeholder { color: var(--text-color-light); opacity: 0.8; }
    form input:focus, form select:focus, form textarea:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px #c7d2fe; outline: none; }
    form select:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.7; }
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 3rem; }
    #toggle-password { position: absolute; right: 1rem; top: 0.75rem; cursor: pointer; color: var(--text-color-light); }
    #toggle-password svg { width: 20px; height: 20px; }
    button { cursor: pointer; border-radius: 8px; border: none; padding: 0.75rem 1.25rem; font-weight: 600; transition: all 0.2s; }
    button:disabled { background-color: #9ca3af !important; cursor: not-allowed; }
    button[type="submit"], #btnAgregarVenta { background-color: var(--primary-color); color: white; }
    button[type="submit"]:hover, #btnAgregarVenta:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--secondary-button-bg); color: var(--secondary-button-text); }
    .btn-secondary:hover { background-color: var(--secondary-button-hover-bg); }
    .btn-eliminar-item, .btn-eliminar-venta { background-color: var(--danger-color); color: white; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
    #listaVentaActual { list-style: none; padding: 0; margin-bottom: 1rem; }
    .list-item-venta { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border-color); }
    .list-item-details { display: flex; flex-direction: column; gap: 0.25rem; }
    .list-item-nota { font-style: italic; font-size: 0.8em; color: var(--text-color-light); }
    .quantity-selector-venta { display: flex; align-items: center; gap: 0.5rem; }
    .quantity-btn-venta { background: none; border: 1px solid var(--border-color); color: var(--text-color-dark); cursor: pointer; font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
    .remove-btn-venta { background-color: var(--danger-color); color: white; border: none; font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background-color: var(--table-header-bg); font-weight: 600; color: var(--text-color-light); }
    #login-container { max-width: 400px; margin: 15vh auto; background: var(--card-background); box-shadow: var(--shadow); border-radius: 12px; }
    .collapsible { background-color: var(--collapsible-bg); color: var(--text-color-dark); }
    .collapsible-wrapper { margin-bottom: 1rem; }
    .collapsible { width: 100%; text-align: left; font-weight: 500; border: 1px solid var(--border-color); border-radius: 8px; }
    .content-collapsible { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 8px 8px; }
    .collapsible-content-padding { padding: 1rem; }
    .options-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .option-btn { padding: 0.5rem 1rem; font-weight: 500; background-color: var(--background-color); color: var(--text-color-dark); border: 1px solid var(--border-color); }
    .option-btn.selected { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    #btnGenerarReporte { background-color: var(--info-color); color: white; }
    #btnGenerarPDF { background-color: #E53E3E; color: white; }
    #btnGenerarPDF:hover { background-color: #C53030; }
    #btnEnviarWhatsapp { background-color: #25D366; color: white; }
    #btnEnviarWhatsapp:hover { background-color: #128C7E; }
    .chart-container { position: relative; width: 100%; }
    #totalPeriodoHistorial { font-weight: bold; font-size: 1.3em; text-align: center; margin-bottom: 1.5rem; padding: 1rem; background-color: #22c55e20; color: var(--success-color); border: 1px solid var(--success-color); border-radius: 8px; }
    #filtros-historial { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; align-items: flex-end; }
    #filtros-historial label { font-size: 0.9em; margin-bottom: 0.5rem; color: var(--text-color-dark); display: block; }
    #resumen-ventas { white-space: pre-wrap; word-break: break-word; }
    .finalizar-venta-info { margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem; }
    .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 1.1rem;}
    .info-row label { font-weight: 600; margin-bottom: 0; }
    .info-row input { width: 120px; text-align: right; padding: 0.5rem; margin-bottom: 0; }
    .info-row span { font-weight: 700; }
    #totalAPagar { font-size: 1.3rem; color: var(--text-color-dark); }
    #cambioVenta { color: var(--success-color); }
    #botones-accion-venta button { width: 100%; margin-bottom: 0.75rem; padding: 0.8rem; font-size: 1rem; }
    .botones-grupo { display: flex; gap: 1rem; }
    .btn-enviar-cocina { background-color: var(--warning-color); color: white; }
    .btn-enviar-cocina:hover { background-color: var(--warning-hover); }
    .btn-guardar-pendiente { background-color: var(--info-color); color: white; flex: 1; }
    .btn-guardar-pendiente:hover { background-color: var(--info-hover); }
    .btn-cobrar { background-color: var(--success-color); color: white; flex: 1; }
    .btn-cobrar:hover { background-color: var(--success-hover); }
    .status-badge { padding: 0.2em 0.6em; border-radius: 12px; font-size: 0.8em; font-weight: 600; color: white; text-align: center; display: inline-block; }
    .status-pagado { background-color: #16a34a; }
    .status-pendiente { background-color: #f59e0b; }
    .status-na { background-color: var(--text-color-light); }
    .btn-marcar-pagado { background-color: var(--success-color); color: white; padding: 0.4rem 0.8rem; font-size: 0.8em; margin-right: 0.5rem; }
    .btn-marcar-pagado:hover { background-color: var(--success-hover); }
    .btn-reimprimir, .btn-editar-venta, .btn-cambiar-fecha { background-color: var(--primary-color); color: white; padding: 0.4rem; font-size: 0.8em; line-height: 1; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-right: 0.5rem; }
    .btn-reimprimir svg, .btn-editar-venta svg, .btn-cambiar-fecha svg { width: 16px; height: 16px; }
    .btn-cambiar-estatus { background: none; border: none; padding: 0; margin-left: 0.5rem; cursor: pointer; color: var(--text-color-light); }
    .btn-cambiar-estatus:hover { color: var(--primary-color); }
    .btn-cambiar-estatus svg { width: 16px; height: 16px; }
    .btn-restaurar { background-color: var(--success-color); color: white; }
    .btn-eliminar-perm { background-color: var(--danger-color); color: white; }
    .full-width-card { grid-column: 1 / -1; }
    #permisos-container { border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    #permisos-container label { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    #permisos-container input[type="checkbox"] { width: auto; margin: 0; }
    .theme-toggle-container { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; margin-bottom: 0.5rem; }
    .theme-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary-color); }
    input:checked + .slider:before { transform: translateX(24px); }
    .fecha-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.5rem; }
    .fecha-item.inactiva { background-color: #f1f5f9; color: var(--text-color-light); text-decoration: line-through; }
    .form-row { display: flex; gap: 1rem; align-items: flex-start; } 
    .form-group { flex: 1; }
    #filtro-rapido-fechas { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    #filtro-rapido-fechas button { padding: 0.5rem 1rem; font-size: 0.9em; }
    .detalle-ventas-mobile { display: none; }
    .venta-card-mobile { background: var(--card-background); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); border-left: 4px solid var(--primary-color); }
    .venta-card-mobile-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); }
    .venta-card-mobile-row:last-child { border-bottom: none; }
    .venta-card-mobile-label { font-weight: 600; color: var(--text-color-light); }
    .venta-card-mobile-value { text-align: right; }
    .venta-card-mobile-actions { margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem; }
    .papelera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;}
    .app-footer, .login-footer { text-align: center; padding: 1.5rem 2rem; font-size: 0.85em; color: var(--text-color-light); }
    .app-footer { border-top: 1px solid var(--border-color); margin-top: auto; }
    .app-footer a, .login-footer a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
    .app-footer a:hover, .login-footer a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; transform: translateX(-100%); }
      .sidebar.nav-open { transform: translateX(0); }
      .app-wrapper { display: block; }
      main { padding: 1rem; }
      .card { padding: 1rem; }
      #tablaVentasDesktop { display: none; }
      .detalle-ventas-mobile { display: block; }
    }
  </style>
  
  <script>
    (function() {
      const token = localStorage.getItem('token');
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp * 1000 < Date.now()) localStorage.removeItem('token');
        } catch (e) { localStorage.removeItem('token'); }
      }
      const style = document.createElement('style');
      style.textContent = localStorage.getItem('token') 
        ? '#login-container { display: none !important; } #app-wrapper { display: flex !important; }' 
        : '#login-container { display: block !important; } #app-wrapper { display: none !important; }';
      document.head.appendChild(style);
    })();
  </script>
</head>
<body>

  <div id="audio-unlock-banner" style="display:none; position: fixed; top: 0; width: 100%; background-color: #f59e0b; color: white; padding: 1rem; text-align: center; z-index: 9999; cursor: pointer;">
    <strong>¡Hay un nuevo pedido!</strong> Haz clic para activar las notificaciones con sonido.
  </div>
  <audio id="notification-sound" src="/sounds/notification.mp3" preload="auto"></audio>

  <div id="login-container" class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <img id="login-logo" src="https://via.placeholder.com/180x60.png?text=Cargando..." alt="Logotipo" style="max-width: 180px; max-height: 70px;">
    </div>
    <div class="card-header"><h2 style="text-align: center;">Iniciar Sesión</h2></div>
    <form id="login-form">
      <div><label for="username">Usuario</label><input type="text" id="username" required></div>
      <div>
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" required>
          <span id="toggle-password">
              <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <svg id="eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
          </span>
        </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // --- ESTADO GLOBAL Y VARIABLES ---
      let ventaActual = {}; 
      let miGraficaDeVentas, miGraficaDeProductos;
      let ventasEnMemoria = [];
      let ventasFiltradasGlobal = [];
      let procesandoVenta = false;
      let pollingIntervalId = null;
      let pedidosNuevosAnteriores = 0;
      let clientesCacheados = [];
      let currentUserRole = null;
      const originalTitle = document.title;
      const { jsPDF } = window.jspdf;

      // --- SELECTORES DEL DOM ---
      const loginContainer = document.getElementById('login-container');
      const appWrapper = document.getElementById('app-wrapper');
      const loginForm = document.getElementById('login-form');
      const logoutButton = document.getElementById('logout-button');
      const welcomeUserSpan = document.getElementById('welcome-user');
      const loginError = document.getElementById('login-error');
      const nav = document.querySelector('.sidebar');
      const menuToggle = document.getElementById('menu-toggle');
      const notificationSound = document.getElementById('notification-sound');
      
      // =================================================================================
      // LÓGICA DE AUTENTICACIÓN Y API (MEJORADA)
      // =================================================================================
      
      function showLogin() {
        localStorage.clear();
        sessionStorage.clear();
        currentUserRole = null;
        if (pollingIntervalId) clearInterval(pollingIntervalId);
        const style = document.head.querySelector('style[data-flicker-guard]');
        if (style) {
            style.textContent = '#login-container { display: block !important; } #app-wrapper { display: none !important; }';
        } else {
          loginContainer.style.display = 'block';
          appWrapper.style.display = 'none';
        }
      }

      async function fetchAPI(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            showLogin();
            throw new Error('No autenticado');
        }
        
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            ...options.headers
        };

        try {
            const response = await fetch(url, { ...options, headers });
            
            if (response.status === 401) {
                showLogin();
                throw new Error('Sesión expirada.');
            }

            if (response.status === 204) return null;
            
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || `Error en la petición a ${url}`);
                }
                return data;
            } else {
                const text = await response.text();
                if(!response.ok) throw new Error(text || `Error de servidor: ${response.status}`);
                return text;
            }
        } catch (error) {
            console.error(`Error en fetchAPI para ${url}:`, error);
            throw error;
        }
      }

      // =================================================================================
      // LÓGICA DE LA APLICACIÓN (FUNCIONES ORIGINALES MANTENIDAS)
      // =================================================================================

      // --- FUNCIONES DE UTILIDAD Y UI ---
      function applyTheme(theme) {
          document.body.classList.toggle('dark-mode', theme === 'dark');
          document.getElementById('theme-switch').checked = (theme === 'dark');
      }

      function setupCollapsibles() {
        document.querySelectorAll(".collapsible").forEach(c => {
            if(c.dataset.listenerAttached) return;
            c.dataset.listenerAttached = 'true';
            c.addEventListener("click", function() {
                this.classList.toggle("active");
                const content = this.nextElementSibling;
                content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
            });
        });
      }

      // --- LÓGICA DE SECCIONES ---
      async function mostrarSeccion(id) {
        document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active-link'));
        
        const seccionActiva = document.getElementById(id);
        const linkActivo = document.querySelector(`.nav-link[data-seccion="${id}"]`);

        if (seccionActiva) {
          seccionActiva.classList.add('active');
          if (linkActivo) linkActivo.classList.add('active-link');
          
          sessionStorage.setItem('lastActiveSection', id);

          const cargarMap = {
            'gestion-pedidos': cargarPedidos,
            'registrar-venta': cargarOpcionesParaVenta,
            'gestion-completa': () => { cargarProductos(); cargarToppings(); cargarJarabes(); },
            'gestion-fechas': cargarFechasDeEntrega,
            'gestion-clientes': cargarClientes,
            'gestion-usuarios': cargarUsuarios,
            'historial-ventas': () => {
                inicializarSelectorFecha();
                cargarClientesParaFiltro();
                cargarUsuariosParaFiltro();
                document.getElementById('btn-filtro-hoy').click();
            },
            'papelera-reciclaje': cargarPapelera,
          };

          if (id === 'gestion-pedidos') {
              try { await fetchAPI('/api/pedidos/marcar-vistos', { method: 'POST' }); verificarNuevosPedidos(); }
              catch (error) { console.error("Error al marcar pedidos como vistos:", error); }
          }
          
          if(cargarMap[id]) await cargarMap[id]();
        }
        nav.classList.remove('nav-open');
      }
      
      // --- LÓGICA DE PEDIDOS ---
      async function cargarPedidos() {
        try {
            const pedidos = await fetchAPI('/api/pedidos');
            if (!pedidos) return;

            const cols = {
                recibidos: document.getElementById('pedidos-recibidos'),
                preparacion: document.getElementById('pedidos-en-preparacion'),
                listos: document.getElementById('pedidos-listos'),
                enReparto: document.getElementById('pedidos-en-reparto')
            };
            Object.values(cols).forEach(c => c.innerHTML = '');

            pedidos.forEach(p => {
                const card = document.createElement('div'); card.className = 'pedido-card';
                let itemsHtml = (p.items || []).map(item => `<li><strong>- ${item.cantidad || 1}x ${item.nombre || item.productoNombre}</strong></li>`).join('');
                const notaHtml = p.nota ? `<div class="pedido-card-nota"><strong>Nota:</strong> ${p.nota}</div>` : '';
                const repartidorHtml = p.repartidorId && p.repartidorId.username ? `<div class="repartidor-info">Repartidor: ${p.repartidorId.username}</div>` : '';
                
                card.innerHTML = `<div class="pedido-card-header"><h4>${p.nombreCliente}</h4><span>${new Date(p.createdAt).toLocaleTimeString()}</span></div><div class="pedido-card-body"><ul>${itemsHtml}</ul>${notaHtml}${repartidorHtml}</div><div class="pedido-card-footer"><span class="total">Total: $${p.total.toFixed(2)}</span><div class="pedido-actions"></div></div>`;
                const actions = card.querySelector('.pedido-actions');
                
                if (p.estatus === 'recibido') {
                    actions.innerHTML = `<button class="btn-whatsapp">Contactar</button><button class="btn-preparar">Preparar</button>`;
                    actions.querySelector('.btn-whatsapp').onclick = () => window.open(`https://wa.me/${p.telefonoCliente.replace(/\D/g, '')}`, '_blank');
                    actions.querySelector('.btn-preparar').onclick = () => cambiarEstatusPedido(p.id, 'en_preparacion');
                    cols.recibidos.appendChild(card);
                } else if (p.estatus === 'en_preparacion') {
                    actions.innerHTML = `<button class="btn-listo">Listo</button>`;
                    actions.querySelector('button').onclick = () => cambiarEstatusPedido(p.id, 'listo');
                    cols.preparacion.appendChild(card);
                } else if (p.estatus === 'listo') {
                    actions.innerHTML = `<button class="btn-asignar">Asignar</button>`;
                    actions.querySelector('button').onclick = () => asignarRepartidor(p.id);
                    cols.listos.appendChild(card);
                } else if (p.estatus === 'en_reparto') {
                    cols.enReparto.appendChild(card);
                }

                const btnCancelar = document.createElement('button'); btnCancelar.className = 'btn-cancelar'; btnCancelar.textContent = 'X'; btnCancelar.title = "Cancelar Pedido"; btnCancelar.onclick = () => cancelarPedido(p.id, p.nombreCliente); actions.appendChild(btnCancelar);
            });
        } catch(e) { console.error("Error cargando pedidos:", e); }
      }
      async function cambiarEstatusPedido(id, nuevoEstatus) { try { await fetchAPI(`/api/pedidos/${id}`, { method: 'PUT', body: JSON.stringify({ estatus: nuevoEstatus }) }); await cargarPedidos(); } catch(e) { alert("Error: " + e.message); } }
      async function asignarRepartidor(pedidoId) { /* ... Tu lógica original completa ... */ }
      async function cancelarPedido(id, nombre) { if(confirm(`Cancelar pedido de ${nombre}?`)) { try { await fetchAPI(`/api/pedidos/${id}`, { method: 'DELETE' }); await cargarPedidos(); } catch(e) { alert("Error: " + e.message); } } }

      // --- LÓGICA DE REGISTRAR VENTA ---
      async function cargarOpcionesParaVenta() {
          await Promise.all([ 
              cargarDataParaSelector('/api/productos', 'ventaProducto', 'id', item => `${item.nombre} ${item.agotado ? '(Agotado)' : ''} - $${item.precio.toFixed(2)}`, true), 
              cargarDataParaSelector('/api/clientes', 'ventaCliente', 'id', 'nombre'),
              cargarDataParaBotones('/api/toppings', 'toppings-container'),
              cargarDataParaBotones('/api/jarabes', 'jarabes-container'),
              cargarDataParaSelector('/api/fechas-entrega', 'fechaEntregaVenta', 'id', fecha => new Date(fecha.fecha).toLocaleDateString('es-MX', {weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC'}))
          ]);
          setupCollapsibles();
      }
      async function cargarDataParaSelector(url, selectId, valueField, textField, checkAgotado = false) { /* ... Tu lógica original completa ... */ }
      async function cargarDataParaBotones(url, containerId) { /* ... Tu lógica original completa ... */ }
      // ... Y el resto de funciones de la venta
      
      // --- LÓGICA DE GESTIÓN (Productos, etc.) ---
      async function cargarProductos() { try { const data = await fetchAPI('/api/productos'); renderizarLista(data, 'Producto', ['nombre', 'precio']); } catch (e) { console.error(e); } }
      async function cargarToppings() { try { const data = await fetchAPI('/api/toppings'); renderizarLista(data, 'Topping', ['nombre', 'precio']); } catch (e) { console.error(e); } }
      async function cargarJarabes() { try { const data = await fetchAPI('/api/jarabes'); renderizarLista(data, 'Jarabe', ['nombre', 'precio']); } catch (e) { console.error(e); } }
      async function guardarItem(e, tipo) { /* ... Tu lógica original completa ... */ }
      async function eliminarItem(id, tipo) { /* ... Tu lógica original completa ... */ }
      
      // --- LÓGICA DE HISTORIAL ---
      function inicializarSelectorFecha() {
          flatpickr("#filtroFecha", {
              mode: "range", dateFormat: "Y-m-d", locale: "es",
              onChange: (selectedDates) => { if (selectedDates.length > 0) cargarVentasHistorial(); }
          });
      }
      // ... Y el resto de funciones de historial
      
      // =================================================================================
      // INICIO DE LA APP
      // =================================================================================
      
      async function showApp() {
        try {
            const token = localStorage.getItem('token');
            if (!token) { showLogin(); return; }
            
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role === 'repartidor') { window.location.replace('/repartidor.html'); return; }
            
            appWrapper.style.display = 'flex';
            loginContainer.style.display = 'none';

            currentUserRole = payload.role;
            welcomeUserSpan.textContent = `Bienvenido, ${payload.username}`;
            
            const esAdmin = payload.role === 'admin';
            const permisos = payload.permissions || {};

            document.querySelectorAll('.nav-link[data-seccion]').forEach(link => {
                const seccion = link.dataset.seccion;
                const permisoRequerido = { 'gestion-completa': 'gestion', 'gestion-fechas': 'admin', 'gestion-clientes': 'clientes', 'gestion-usuarios': 'usuarios', 'historial-ventas': 'historial', 'papelera-reciclaje': 'papelera', 'gestion-pedidos': 'pedidos' }[seccion];
                if (permisoRequerido) {
                    link.style.display = (esAdmin || (permisos && permisos[permisoRequerido])) ? 'flex' : 'none';
                }
            });
            document.getElementById('customization-container').style.display = esAdmin ? 'block' : 'none';
            if (document.getElementById('filtro-usuario-container')) {
              document.getElementById('filtro-usuario-container').style.display = esAdmin ? 'block' : 'none';
            }
            
            let seccionInicial = sessionStorage.getItem('lastActiveSection') || 'registrar-venta';
            await mostrarSeccion(seccionInicial);
            
            if (esAdmin || (permisos && permisos.pedidos)) {
                iniciarPollingDePedidos();
            }

        } catch (e) { 
            console.error("Error en showApp:", e); 
            showLogin();
        }
      }

      // --- SETUP INICIAL ---
      (async () => {
        // Carga de tema y config pública
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);
        await loadPublicConfig();

        // Setup de listeners de UI principales
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeOpen.style.display = type === 'password' ? 'block' : 'none';
            eyeClosed.style.display = type === 'text' ? 'block' : 'none';
        });

        menuToggle.addEventListener('click', () => nav.classList.toggle('nav-open'));
        logoutButton.addEventListener('click', showLogin);
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = '';
            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const button = e.target.querySelector('button[type="submit"]');
            ui.toggleButtonLoading(button, true, 'Entrar');
            try {
                const response = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Credenciales inválidas');
                localStorage.setItem('token', data.token);
                if (data.role === 'repartidor') { window.location.href = '/repartidor.html'; return; }
                sessionStorage.removeItem('lastActiveSection');
                const style = document.head.querySelector('style[data-flicker-guard]');
                if (style) style.textContent = '#login-container { display: none !important; } #app-wrapper { display: flex !important; }';
                await showApp();
            } catch (error) {
                loginError.textContent = error.message;
            } finally {
                ui.toggleButtonLoading(button, false, 'Entrar');
            }
        });
        document.getElementById('theme-switch').addEventListener('change', (e) => {
            const theme = e.target.checked ? 'dark' : 'light';
            applyTheme(theme);
            localStorage.setItem('theme', theme);
        });
        
        // Setup de listeners de Navegación y Secciones (¡Importante!)
        document.querySelectorAll('.nav-link[data-seccion]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                mostrarSeccion(link.dataset.seccion);
            });
        });

        // Exponer funciones globales que se usan en `onclick`
        window.app = { toggleAgotado, toggleFecha, eliminarFecha };

        // Mostrar app o login
        if (localStorage.getItem('token')) {
          await showApp();
        } else {
          showLogin();
        }
        
        document.body.style.visibility = 'visible';
      })();
    });
  </script>
